<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QR Code Generator</title>
<link rel="icon" type="image/png" href="favicon.png"/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header>
  <div class="badge">// QR Generator</div>
  <h1>QR Code Generator</h1>
  <p class="subtitle">link · text · email · phone · anything</p>
</header>

<div class="card">
  <div class="input-group">
    <label>Content / Data</label>
    <textarea id="qr-input" placeholder="https://example.com&#10;any text · email · phone · wifi&#10;Ctrl+Enter to generate" rows="3"></textarea>
  </div>
  <div class="options-row">
    <div class="opt-group">
      <label>Error Correction</label>
      <div class="ec-row" id="ec-group">
        <div class="ec-btn" data-ec="L">L · 7%</div>
        <div class="ec-btn active" data-ec="M">M · 15%</div>
        <div class="ec-btn" data-ec="Q">Q · 25%</div>
        <div class="ec-btn" data-ec="H">H · 30%</div>
      </div>
    </div>
    <div class="opt-group">
      <label>Quiet Zone (margin)</label>
      <select id="qr-margin">
        <option value="0">None — 0</option>
        <option value="1" selected>Small — 1</option>
        <option value="2">Normal — 2</option>
        <option value="4">Large — 4</option>
      </select>
    </div>
  </div>
  <div class="color-row">
    <div class="opt-group">
      <label>Foreground Color</label>
      <div class="color-wrap">
        <input type="color" id="fg-color" value="#000000"/>
        <span class="color-label">Module</span>
        <span class="color-hex" id="fg-hex">#000000</span>
      </div>
    </div>
    <div class="opt-group">
      <label>Background Color</label>
      <div class="color-wrap">
        <input type="color" id="bg-color" value="#ffffff"/>
        <span class="color-label">Canvas</span>
        <span class="color-hex" id="bg-hex">#ffffff</span>
      </div>
    </div>
  </div>
  <div class="size-row">
    <div class="size-header">
      <label>Export Size (px)</label>
      <span class="size-val" id="size-display">400 × 400</span>
    </div>
    <input type="range" id="qr-size" min="100" max="1200" step="50" value="400"/>
  </div>
  <button class="gen-btn" onclick="generateQR()">⬡ Generate QR Code</button>
</div>

<div class="output-card" id="output-card">
  <div class="qr-preview">
    <div id="qr-svg-container"></div>
  </div>
  <p class="dl-section-label">Download As</p>
  <div class="dl-btns">
    <button class="dl-btn svg-btn" onclick="downloadSVG()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      SVG Vector
    </button>
    <button class="dl-btn png-btn" onclick="downloadPNG()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      PNG Image
    </button>
    <button class="dl-btn jpg-btn" onclick="downloadJPG()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      JPG Image
    </button>
  </div>
  <div class="info-strip">
    <span>📦 Version <strong id="info-version">—</strong></span>
    <span>🔲 <strong id="info-modules">—</strong> modules</span>
    <span>🎨 EC <strong id="info-ec">—</strong></span>
    <span>📐 <strong id="info-size">—</strong></span>
  </div>
</div>

<script src="js/qr-encoder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
